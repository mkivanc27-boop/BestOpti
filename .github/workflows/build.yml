name: Build Mod
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clean and Build
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf ~/.gradle/caches/fabric-loom
          gradle clean build --no-daemon --refresh-dependencies

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OptiBest-Build
          path: build/libs/
