name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      # Gradle Wrapper yerine doğrudan Gradle'ı kuruyoruz
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build 
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OptiBest-Mod
          path: build/libs/*.jar
          
