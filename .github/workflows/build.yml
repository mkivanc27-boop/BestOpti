name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Force Clean and Build
        run: |
          # 1. Gradle cache'ini tamamen sil
          rm -rf ~/.gradle/caches/
          # 2. Proje içi cache'leri sil
          rm -rf .gradle/
          # 3. Build klasörünü temizle
          rm -rf build/
          # 4. Sistemdeki gradle ile derle
          gradle clean build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiBest-Mod
          path: build/libs/
          
