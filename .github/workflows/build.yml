name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Clean Cache
        run: |
          # En kritik kısım burası: Minecraft kurulum dosyalarını siliyoruz
          rm -rf ~/.gradle/caches/fabric-loom
          rm -rf .gradle/loom-cache
          
          # Şimdi derlemeye zorluyoruz
          gradle clean build
          
