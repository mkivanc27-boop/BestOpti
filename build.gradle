plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = "1.0.0"
group = "com.mustafa.optibest"

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.8"
    mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    
    // Performans modları
    modImplementation "maven.modrinth:lithium:1.21.8"
    modImplementation "maven.modrinth:ferritecore:7.0.0"
    modImplementation "maven.modrinth:entity-culling:1.7.0"
    modImplementation "maven.modrinth:modernfix:5.19.0"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
