plugins {
    id 'fabric-loom' version '1.13.469'
}

version = "1.0.0"
group = "com.mustafa.optibest"

repositories {
    mavenCentral()
}

dependencies {
    // Minecraft temeli
    minecraft "com.mojang:minecraft:1.21.8"
    mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"

    // Libs klasöründeki ModMenu ve MidnightLib dosyalarını kullanır
    modImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
