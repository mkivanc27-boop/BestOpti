plugins {
    id 'fabric-loom' version '1.11.8'
}

version = "1.0.0"
group = "com.mustafa.optibest"

repositories {
    mavenCentral()
    // Modrinth kütüphaneleri için kesin çözüm
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    // Minecraft temeli
    minecraft "com.mojang:minecraft:1.21.8"
    mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"

    // Modrinth'ten kütüphaneleri çekiyoruz (ModMenu ve MidnightLib)
    // Eğer burası yine hata verirse versiyon numaralarını biraz düşürürüz
    modImplementation "maven.modrinth:midnightlib:1.9.2-fabric"
    modImplementation "maven.modrinth:modmenu:11.0.0"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
