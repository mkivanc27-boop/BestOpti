plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

version = "1.0.0"
group = "com.mustafa.optibest"

repositories {
    mavenCentral()
    flatDir { dirs 'libs' } // Bu satır çok önemli!
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.8"
    mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    
    // İnternetten indirmeye çalışmayacak, sadece senin libs içindeki dosyalarını alacak:
    modImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
